name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler versão
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar pasta dist
        run: npm run build

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar web no Android
        run: npx cap sync android

      - name: Identidade do fornecedor no APK
        run: node scripts/stamp-android.mjs

      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "fitcraft-${{ steps.ver.outputs.version }}.apk"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: fitcraft-${{ steps.ver.outputs.version }}
          path: fitcraft-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error
